# Training configuration

data:
  train_dir: "data/cleaned"
  val_split: 0.1
  filter_success: false  # Only use successful trajectories
  max_trajectories: null  # null = use all

model:
  name: "gpt2"
  device: "cpu"  # or "cuda"
  freeze_layers: []  # Layers to freeze during training

training:
  num_epochs: 10
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip: 1.0

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1e-8

checkpointing:
  save_dir: "checkpoints"
  save_every: 1  # Save every N epochs
  keep_last: 3   # Keep last N checkpoints

logging:
  log_dir: "logs"
  log_every: 10  # Log every N batches
  wandb: false   # Use Weights & Biases
  wandb_project: "web-agent-slm"
